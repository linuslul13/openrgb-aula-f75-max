name: Packet and adapter tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run device-protocol/mock-adapter tests
        run: bash tests/run_tests.sh
      - name: Check repository for accidental private data
        run: python3 tools/privacy_check.py
